<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculis</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculis</h1>

      <div id="lastResults"></div>
      <div id="main">
        <selector class="selector">
          <label for="operation" class="selectLabel">Your choice --></label>
          <select id="operation" name="operation">
            <option value="">-- Please choose an option --</option>
            <option value="addition" id="addition">Addition (+)</option>
            <option value="subtraction" id="subtraction">
              Subtraction (-)
            </option>
            <option value="multiplication" id="multiplicatio">
              Multiplication (x)
            </option>
            <option value="random" id="random">Random operation (?)</option>
          </select>
        </selector>
        <input type="button" class="btn" id="startBtn" value="Start" />

        <br />
        <section class="problem">
          <div id="number1" class="problem"></div>
          <div id="operator" class="problem"></div>
          <div id="number2" class="problem"></div>
          <div id="equals" class="problem">=</div>
        </section>
        <input type="text" id="answer" />
        <input
          type="button"
          class="btn checkBtn"
          value="Check Answer"
          onclick="checkAnswer()"
        />
        <div id="feedback"></div>
        <div id="score"></div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
